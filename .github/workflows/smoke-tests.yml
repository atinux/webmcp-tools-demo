name: Smoke Tests

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    name: Smoke Test (Sport Shop)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22
          cache: "npm"
          cache-dependency-path: demos/sport-shop-angular/package-lock.json

      - name: Install demo dependencies
        working-directory: demos/sport-shop-angular
        run: npm ci

      - name: Build demo
        working-directory: demos/sport-shop-angular
        run: npm run build

      - name: Start dev server
        working-directory: demos/sport-shop-angular
        run: |
          npm start -- --port 3000 > /tmp/sport-shop.log 2>&1 &
          timeout 60s bash -c 'until curl -fsS http://localhost:3000 > /dev/null; do sleep 1; done'

      - name: Verify homepage
        run: curl -fsS http://localhost:3000 | grep -q "WebMCP Sports"
